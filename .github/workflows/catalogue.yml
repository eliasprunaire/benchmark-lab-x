name: Contrôle du catalogue OpenRouter

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1f # v7.0.1

      - name: Contrôler les familles et modèles
        run: python -m benchmark.model_catalogue --report
