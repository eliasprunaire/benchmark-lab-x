name: CI minimale Python

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurer uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: false

      - name: Configurer Node pour la qualification Pi
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.8.2"
          package-manager-cache: false

      - name: Lire la version Pi du produit
        run: echo "BENCHMARK_PI_VERSION=$(python3 -c 'from benchmark.transports.pi import VERSION; print(VERSION)')" >> "$GITHUB_ENV"

      - name: Installer Pi pour les réponses fictives
        run: |
          npm install --prefix "$RUNNER_TEMP/benchmark-pi" --ignore-scripts --no-audit --no-fund --save-exact \
            "@earendil-works/pi-coding-agent@$BENCHMARK_PI_VERSION" \
            "@earendil-works/pi-agent-core@$BENCHMARK_PI_VERSION" \
            "@earendil-works/pi-ai@$BENCHMARK_PI_VERSION"

      - name: Vérifier le harnais Linux sans appel modèle
        env:
          BENCHMARK_TEST_PI_PACKAGE: ${{ runner.temp }}/benchmark-pi/node_modules/@earendil-works/pi-coding-agent
        run: |
          uv run --with-requirements benchmark/requirements.txt --python 3.12 python -m benchmark.runtime inspect-pi \
            --pi-package "$BENCHMARK_TEST_PI_PACKAGE" --node "$(command -v node)"
          uv run --with-requirements benchmark/requirements.txt --with requests --with mpmath==1.3.0 python -m unittest -v tests.test_private_comparison

      - name: Exécuter les tests
        env:
          BENCHMARK_TEST_PI_PACKAGE: ${{ runner.temp }}/benchmark-pi/node_modules/@earendil-works/pi-coding-agent
        run: uv run --with-requirements benchmark/requirements.txt --with requests --with mpmath==1.3.0 python -m unittest discover -s tests

      - name: Vérifier la version cryptographique du runtime Linux
        run: uv run --with cryptography==41.0.7 --with requests --with mpmath==1.3.0 python -m unittest tests.test_provider_crypto tests.test_privacy

      - name: Vérifier les archives dans Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/privacy-browser" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.57.0
          "$RUNNER_TEMP/privacy-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/privacy-browser/node_modules/playwright/index.js" node --test tests/privacy_browser.test.cjs

      - name: Construire le runtime du commit vérifié
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run --python 3.12 python tools/build_runtime.py --source "$SOURCE_SHA" --output "$RUNNER_TEMP/benchmark-runtime.tar.gz"

  pi-version:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vérifier la dernière version Pi publiée
        run: |
          attendue="$(python3 -c 'from benchmark.transports.pi import VERSION; print(VERSION)')"
          publiee="$(npm view @earendil-works/pi-coding-agent version)"
          test "$attendue" = "$publiee" || {
            echo "::error::Pi $publiee est publié, mais le produit épingle $attendue"
            exit 1
          }
