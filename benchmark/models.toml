# Configuration active du catalogue, livrée avec le paquet `benchmark`
# Lue par benchmark/model_catalogue.py (CONFIG_PATH) : le relevé filtré des
# modèles OpenRouter et les paliers de raisonnement doivent rester disponibles
# hors du dépôt source, dans l'archive runtime
#
# [catalogue].excluded_providers : slugs de fournisseurs, liste vide par défaut, inférés du préfixe du tag

[catalogue]
makers = ["openai", "anthropic", "google", "x-ai", "meta", "mistralai", "deepseek", "qwen", "moonshotai", "z-ai", "minimax", "cohere", "ai21", "nvidia", "amazon", "microsoft"]
max_per_maker = 3
max_age_days = 365
cache_hours = 24
# Gammes généralistes par ordre de priorité éditoriale, pas un classement de qualité
# Les variantes Pro OpenAI et Contributor Meta ne prennent pas une seconde place
