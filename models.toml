# Registre des modèles pour les campagnes : choisir avec :
#   uv run tools/collect.py tasks/dev/<slug> --alias <name> --run N
# Champs : model (identifiant OpenRouter), nom_public (nom commercial affiché
# sur la page, sans le niveau de raisonnement que la page ajoute elle-même),
# provider (slug du pin),
# expect_provider optionnel (nom d'affichage servi quand il diffère du slug),
# reasoning_effort ou reasoning_max_tokens optionnel. Une valeur différente
# exige un alias distinct
# data_collection : "deny" sur les alias destinés aux campagnes futures
# [catalogue].excluded_providers : slugs de fournisseurs, liste vide par défaut, inférés du préfixe du tag
# Ajouter ou retirer des entrées librement ; le collecteur ne boucle jamais sur ce fichier.
#
# L’éligibilité au catalogue constate seulement un endpoint disponible et ne
# présume pas la politique de données de ses hébergeurs
# Ajouter une configuration future : vérifier ses routes
#   curl -s https://openrouter.ai/api/v1/models/<id>/endpoints
# puis épingler celles qui acceptent `data_collection: deny`, imposé à chaque
# appel candidat au titre de R-005

