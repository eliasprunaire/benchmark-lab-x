[tiers]

[tiers.deepseek]
enhanced = { enabled = true }

# reasoning_max_tokens a été retiré des candidats de base le 2026-08-05 : le
# paramètre était limitant chez Alibaba et ignoré chez Novita. Toute valeur
# qualifiée vit désormais sous un alias distinct ; elle ne se mélange jamais au
# candidat sans paramètre. Le budget de sortie max_tokens reste commun

# omit_params : réglages d'échantillonnage que l'endpoint épinglé rejette sous
# require_parameters (vérifié contre /models/<id>/endpoints) ; l'omission est
# consignée dans le meta.json de chaque run

# DeepSeek V4.1 Flash remplace 0731 dans les nouveaux essais
# Route DeepSeek disponible et top_p déclaré le 2026-09-12 ; seed non déclaré
[deepseek-v4-1-flash]
model = "deepseek/deepseek-v4.1-flash"
nom_public = "DeepSeek V4.1 Flash"
provider = "deepseek"
omit_params = ["seed"]

# reasoning supporté chez Alibaba (vérifié /endpoints 2026-08-04)
[qwen3-8-max]
model = "qwen/qwen3.8-max"
nom_public = "Qwen3.8 Max"
provider = "alibaba"

# [laguna-s-2-1]
# model = "poolside/laguna-s-2.1"
# provider = "poolside"
# omit_params = ["seed", "top_p"]

# # candidat référent permanent ; l'endpoint rejette
# # temperature/top_p (famille reasoning), omission consignée dans meta.json
# Aucun suffixe d'effort : ce candidat n'envoie aucun `reasoning_effort` et le
# niveau que le fournisseur applique par défaut n'a jamais été mesuré. Le
# nommer « default » laissait croire à un réglage nommé qui n'existe pas ; le
# nommer « medium » serait pire, ce serait inventer la valeur. Dès que la sonde
# d'efforts aura identifié le niveau réellement appliqué, cet alias prend son nom
[reference-gpt-5-6]
model = "openai/gpt-5.6-sol"
nom_public = "GPT 5.6-sol"
provider = "openai"
omit_params = ["temperature", "top_p"]

# même modèle, effort de raisonnement high. L’ancienne sonde employait l’alias
# ambigu reference-gpt-5-6-max ; le registre courant nomme la valeur réelle
[reference-gpt-5-6-high]
model = "openai/gpt-5.6-sol"
nom_public = "GPT 5.6-sol"
provider = "openai"
omit_params = ["temperature", "top_p"]
reasoning_effort = "high"

# effort xhigh : accepté par l'API, mais une valeur inconnue peut être acceptée
# puis ignorée en silence. La vérification est la comparaison de consommation de
# raisonnement avec l'alias high sur la même carte : si elle ne diffère pas,
# l'effort n'a pas été appliqué et l'alias doit être retiré
[reference-gpt-5-6-xhigh]
model = "openai/gpt-5.6-sol"
nom_public = "GPT 5.6-sol"
provider = "openai"
omit_params = ["temperature", "top_p"]
reasoning_effort = "xhigh"

# --- petits modèles, ajoutés le 2026-08-04 pour la sonde de plancher de difficulté ---
# Question posée : un petit modèle tombe-t-il dans les pièges d'engagement comme
# les trois plus gros ? S'il n'y tombe pas, la carte ne mesure rien.
# /endpoints n'expose plus de data_policy par endpoint ; la conformité repose
# sur le réglage de compte « pas d'entraînement sur les requêtes » (RULES R-005)

# --- élargissement du panel, 2026-08-04 ---
# Couverture voulue : US, CN, UE. Chaque entrée est épinglée sur un hébergeur
# qui supporte seed, sans quoi la graine fixe de campagne ne tiendrait pas

# CN, sorti le 2026-07-16

# US, sorti le 2026-07-08 ; aucun effort envoyé, distinct de high par la
# consommation de raisonnement mesurée. Le niveau appliqué par défaut reste
# inconnu, donc l'alias reste sans suffixe
[grok-4-5]
model = "x-ai/grok-4.5"
nom_public = "Grok 4.5"
provider = "xai"

# CN, sorti le 2026-06-16
# RETIRÉ du panel le 2026-08-04 : 25 minutes par appel sur la carte pentagone,
# contre 3,5 min pour grok-4.5. La lenteur est consignée comme diagnostic,
# le modèle ne participe plus aux campagnes
# [glm-5-2]
# model = "z-ai/glm-5.2"
# provider = "novita"

# dense 27B, sorti le 2026-04-27
# Candidat historique sans paramètre de raisonnement : aucun jeton de
# raisonnement déclaré par l’endpoint lors de la sonde, niveau retenu 1
# [qwen3-6-27b]
# model = "qwen/qwen3.6-27b"
# provider = "alibaba"

# # Même modèle et même route avec reasoning.max_tokens=32768. Candidat distinct :
# # l’endpoint a déclaré des jetons de raisonnement. Rejeu du 2026-08-05 avec le
# # vérificateur courant : niveaux 10 et 1, donc niveau retenu 1. Le paramètre ne
# # démontre aucune amélioration stable ni le mécanisme interne du modèle
# [qwen3-6-27b-r32768]
# model = "qwen/qwen3.6-27b"
# provider = "alibaba"
# reasoning_max_tokens = 32768

# # 8B le plus récent disponible, sorti le 2026-04-30 ; pas de paramètre reasoning
# # [granite-4-1-8b]
# # model = "ibm-granite/granite-4.1-8b"
# # provider = "coreweave"

# # # sorti le 2025-12-02, huit mois d'âge au moment du test : gardé comme témoin,
# # # son âge est une limite connue de la comparaison
# # [ministral-8b]
# # model = "mistralai/ministral-8b-2512"
# # provider = "mistral"

# US, sorti le 2026-06-09 ; second modèle frontière du panel
# L'effort de raisonnement fait partie de l'identité du candidat, au même titre
# que la route. Comparer un modèle à effort maximal contre un autre à son effort
# par défaut mesure aussi les réglages. Un alias par triplet modèle, route et
# effort ; jamais d'effort implicite sur un modèle qui expose ce paramètre
[fable-5-high]
model = "anthropic/claude-fable-5"
nom_public = "Claude Fable 5"
provider = "anthropic"
omit_params = ["seed", "temperature", "top_p"]
reasoning_effort = "high"

[fable-5-medium]
model = "anthropic/claude-fable-5"
nom_public = "Claude Fable 5"
provider = "anthropic"
omit_params = ["seed", "temperature", "top_p"]
reasoning_effort = "medium"

[fable-5-xhigh]
model = "anthropic/claude-fable-5"
nom_public = "Claude Fable 5"
provider = "anthropic"
omit_params = ["seed", "temperature", "top_p"]
reasoning_effort = "xhigh"

[grok-4-5-high]
model = "x-ai/grok-4.5"
nom_public = "Grok 4.5"
provider = "xai"
reasoning_effort = "high"

# Opus 5, ajouté le 2026-08-05 pour compléter la couverture Anthropic
[opus-5-high]
model = "anthropic/claude-opus-5"
nom_public = "Claude Opus 5"
provider = "anthropic"
omit_params = ["seed", "temperature", "top_p"]
reasoning_effort = "high"

[opus-5-xhigh]
model = "anthropic/claude-opus-5"
nom_public = "Claude Opus 5"
provider = "anthropic"
omit_params = ["seed", "temperature", "top_p"]
reasoning_effort = "xhigh"

# Panel élargi le 2026-08-05. Les quatre petits modèles sortent du panel général :
# ils seront testés sur des cartes dédiées à leur catégorie de poids
[mistral-medium-3-5]
model = "mistralai/mistral-medium-3-5"
nom_public = "Mistral Medium 3.5"
provider = "mistral"

# Les quatre suivants : provider épinglé sur le fournisseur de premier rang du
# modèle, et `seed` omis parce que leurs endpoints ne l'exposent pas
[mimo-v2-5]
model = "xiaomi/mimo-v2.5"
nom_public = "MiMo V2.5"
provider = "xiaomi"
# Le dépôt officiel et sa procédure SGLang publient ce modèle en FP8
# https://huggingface.co/XiaomiMiMo/MiMo-V2.5
format_reference = "fp8"
omit_params = ["seed"]

[minimax-m3]
model = "minimax/minimax-m3"
nom_public = "MiniMax M3"
provider = "minimax"
omit_params = ["seed"]

# Route de premier rang DeepSeek, refusée sous le régime `retenu` : elle
# s'entraîne sur les données des requêtes. Accessible sous `--regime expose`,
# le seul régime des cartes déjà publiques (R-005 scindée le 2026-08-05)
[deepseek-v4-pro]
model = "deepseek/deepseek-v4-pro"
nom_public = "DeepSeek V4 Pro"
provider = "deepseek"
omit_params = ["seed"]

# Nouvelle configuration scientifique FP8, distincte des acquisitions BF16
# historiques. AtlasCloud est la route primaire et DeepInfra la secondaire
# préenregistrée dans le lock HY3 FP8
[hy3]
model = "tencent/hy3"
nom_public = "Hy3"
provider = "atlas-cloud"
expect_provider = "AtlasCloud"
format_reference = "fp8"

# Kimi K3 sur routes alternatives, ajoutées le 2026-08-05. La route Morph rend
# 429 « temporarily rate-limited upstream » sur douze tentatives consécutives.
# Sous R-003 une autre route reste visible. Elle rejoint la même série seulement
# si révision, quantification, paramètres, contexte et politique sont identiques

# BaseTen impose top_p : « Cannot override enforced sampling params »

# Sonde d'effort, 2026-08-05. `default` consomme environ 2833 jetons de
# raisonnement contre 8650 en `high` : GPT 5.6-sol raisonne donc toujours, même
# sans paramètre. Ces alias servent à identifier quelle valeur nommée
# correspond au défaut, en comparant la consommation sur la même carte

# Kimi K3 expose reasoning_effort. Vérifier si `max` est accepté et distinct

# Kimi K3, 2026-08-05. Le candidat sans effort déclaré est retiré : son défaut
# a consommé 23 207 puis 43 422 jetons de raisonnement sur deux runs identiques.
# Un effort qui varie du simple au double n'est pas un candidat, c'est un tirage
#
# CORRECTION DU 2026-08-06, SOIR. J'avais écrit le matin même que Modal servait
# ce modèle « en mxfp4, quatre bits » et qu'il fallait donc lui préférer une
# route fp8. C'était faux, et l'erreur venait d'appliquer une échelle absolue de
# bits à un modèle qui n'en relève pas.
#
# Kimi K3 est entraîné avec quantification dans la boucle : les poids publiés
# par Moonshot SONT en MXFP4 pour les experts, avec activations MXFP8 et BF16
# pour le reste. Aucun checkpoint BF16 de référence n'existe. MXFP4 est donc le
# format natif, celui que l'éditeur publie et sert lui-même ; `wafer/fp8` et
# `baseten/fp8` sont des requantifications qui s'en écartent, dans un sens
# comme dans l'autre.
#
# Route retenue : `moonshotai`, celle de l'éditeur, format publié, 100 % de
# disponibilité. Les deux routes fp8 vers lesquelles mon erreur nous avait
# menés sont précisément les deux qui saturent : testées le 2026-08-06, wafer
# et baseten rendent 429 quand moonshotai, modal, morph, together, fireworks et
# digitalocean répondent.
#
# Elle refuse `temperature`, `top_p` et `seed`, ce qui concorde exactement avec
# la documentation de Moonshot : ces trois réglages sont fixés côté modèle et
# doivent être omis. Cette concordance entre l'API directe et la route
# OpenRouter confirme qu'on est sur le service de référence.
#
# R-005 : la route accepte `data_collection: deny`, vérifié le 2026-08-06. Elle
# est donc conforme au régime retenu, contrairement à l'API Moonshot directe
# dont les conditions prévoient l'entraînement sur les requêtes sans retrait.
[kimi-k3-max]
model = "moonshotai/kimi-k3"
nom_public = "Kimi K3"
provider = "moonshotai"
# OpenRouter sert cette route sous le nom d'affichage « Moonshot AI » alors que
# le slug du pin est « moonshotai » : le contrôle de route les compare après
# normalisation et les voyait différents. Le champ existe pour ce cas
expect_provider = "Moonshot AI"
format_reference = "mxfp4"
omit_params = ["temperature", "top_p", "seed"]
reasoning_effort = "max"

# --- Muse Spark 1.2, ajouté le 2026-08-06 ---
# Sondé avant ajout, comme l'exige la discipline sur les niveaux de raisonnement.
# Contrairement à la présomption de départ, ce modèle EXPOSE des niveaux : les
# sept valeurs essayées sont toutes acceptées.
#
#   effort      jetons de raisonnement (3 tirages)
#   (aucun)     2787  3335  3511
#   minimal     1106  1251  1400
#   low         1690  1979  2174
#   medium      2093  2378  2899
#   high        2849  2891  3670
#   xhigh       3583  3715  3836
#   max         2817  3343  3413
#
# Un seul niveau retenu, `max`. On mesure le haut de gamme de chaque modèle,
# pas son échelle complète : ouvrir `minimal` et `low` ici obligerait à les
# ouvrir chez OpenAI et Anthropic, et le panel deviendrait ingérable.
#
# Le choix de `max` plutôt que `high` évite au passage un problème non résolu :
# sur trois tirages, les plages de `high`, `xhigh` et `max` se recouvrent, et
# rien ne prouvait qu'ils soient des candidats distincts au sens de R-003. Une
# seconde sonde à six tirages a été coupée par un 429 du fournisseur. Avec un
# seul alias, la question ne se pose plus.
#
# Route : `meta`, seule route existante, celle de l'éditeur, précision non
# déclarée, 1 040 384 jetons de complétion. Elle refuse `seed`.

[muse-spark-1-2-max]
model = "meta/muse-spark-1.2"
nom_public = "Muse Spark 1.2"
provider = "meta"
omit_params = ["seed"]
reasoning_effort = "max"

# Configurations OpenRouter vérifiées le 2026-09-12, effort low commun à la recette
